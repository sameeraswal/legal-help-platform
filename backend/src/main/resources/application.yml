spring:
  application:
    name: legal-help-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:legalhelp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:legalhelp}
    password: ${DB_PASSWORD:legalhelp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  encryption:
    key: ${ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  llm:
    provider: ${LLM_PROVIDER:openai}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4.1}
    temperature: ${LLM_TEMPERATURE:0.3}
    connect-timeout: ${LLM_CONNECT_TIMEOUT:10s}
    request-timeout: ${LLM_REQUEST_TIMEOUT:60s}
    retry:
      max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
      initial-backoff: ${LLM_RETRY_INITIAL_BACKOFF:500ms}
      backoff-multiplier: ${LLM_RETRY_BACKOFF_MULTIPLIER:2.0}
    open-router:
      referer: ${LLM_OPENROUTER_REFERER:}
      title: ${LLM_OPENROUTER_TITLE:}
  chat:
    metering-tick-seconds: 10
    cutoff-warning-seconds: 60
    default-free-minutes: ${DEFAULT_FREE_MINUTES:30}
    scheduled-metering-enabled: true
  storage:
    petition-dir: ${PETITION_STORAGE_DIR:./data/petitions}
  billing:
    default-payout-threshold-minor-units: ${DEFAULT_PAYOUT_THRESHOLD_MINOR_UNITS:100000}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
