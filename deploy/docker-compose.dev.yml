services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-legalhelp}
      MYSQL_USER: ${DB_USER:-legalhelp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-legalhelp}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-legalhelp_root}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-legalhelp_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: ["./mvnw", "spring-boot:run"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-legalhelp}
      DB_USER: ${DB_USER:-legalhelp}
      DB_PASSWORD: ${DB_PASSWORD:-legalhelp}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char secret in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a base64 32-byte key in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      LLM_OPENROUTER_REFERER: ${LLM_OPENROUTER_REFERER:-}
      LLM_OPENROUTER_TITLE: ${LLM_OPENROUTER_TITLE:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5178
      PETITION_STORAGE_DIR: /workspace/data/petitions
    volumes:
      - ../backend:/workspace
      - maven_repo:/root/.m2
      - petition_storage:/workspace/data/petitions
    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8088
      VITE_WS_BASE_URL: ws://localhost:8088
    volumes:
      - ../frontend:/workspace
    ports:
      - "5178:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
  maven_repo:
  petition_storage:
